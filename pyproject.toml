[project]
name = "cyclist-tracker"
version = "1.0.0"
description = "Vision-based cyclist detection, tracking, counting and speed estimation (DETR + DeepSORT + homography) with a desktop GUI."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Avishkar Borkar", email = "avishklar.borkar@student.nhlstenden.com" },
    { name = "Koen Molenaar", email = "koen.molenaar1@nhlstenden.com" },
]
requires-python = ">=3.11,<3.13"
keywords = ["computer-vision", "cyclists", "tracking", "deepsort", "detr", "speed-estimation", "homography"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.46",
    "timm>=1.0",
    "lightning>=2.4",
    "deep-sort-realtime==1.3.2",
    "motmetrics>=1.4.0",
    "numpy>=1.26,<2",
    "opencv-python-headless>=4.10",
    "pandas>=2.2",
    "pillow>=10.4",
    "pycocotools>=2.0.8",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "tensorboard>=2.17",
    "tqdm>=4.66",
    "PyQt6>=6.7",
]

[project.optional-dependencies]
# Extra re-identification feature extractors for DeepSORT (see README).
clip = ["clip @ git+https://github.com/openai/CLIP.git", "ftfy", "regex"]
torchreid = ["pyppbox-torchreid==1.4.0.3", "gdown"]

[project.scripts]
cyclist-tracker = "cyclist_tracker.cli:main"

[project.gui-scripts]
cyclist-tracker-gui = "cyclist_tracker.gui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
docs = [
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyclist_tracker"]

[tool.hatch.metadata]
allow-direct-references = true

# CUDA 12.8 builds of PyTorch on Linux and Windows; the default (CPU/MPS) wheels on macOS.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast, isolated tests of a single function or class",
    "integration: tests that combine several modules (pipelines, file formats)",
    "system: end-to-end tests of the CLI and GUI as a user would run them",
    "slow: tests that download or run real deep-learning models",
]
qt_api = "pyqt6"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741"]
