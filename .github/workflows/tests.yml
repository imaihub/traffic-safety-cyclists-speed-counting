name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Unit, integration and system tests (without model downloads)
        run: uv run pytest -m "not slow" --cov=cyclist_tracker --cov-report=term-missing
